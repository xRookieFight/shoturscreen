[package]
name = "shoturscreen"
version = "0.1.0"
edition = "2024"
description = "Fast region screenshot to clipboard for KDE Plasma on Wayland"
license = "MIT"
repository = "https://github.com/xRookieFight/shoturscreen"

[dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
